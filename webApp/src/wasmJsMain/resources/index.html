<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!--
      The page follows the same setting Compose does. isSystemInDarkTheme() reads
      prefers-color-scheme in a browser, so without this the page around the canvas - and everything
      the browser draws itself, from scrollbars to form controls - would stay light while the app
      went dark. Android has the same pairing in values-night/themes.xml.
    -->
    <meta name="color-scheme" content="light dark">
    <title>Sax Trainer</title>
    <!-- A copy of additional/icons/app_icons.svg, for a look at the app icon in a browser tab. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        /* The canvas fills the window, and the page itself never scrolls: Compose does its own. */
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

        /*
          The default theme's background (the Brass seed, light and dark), as generated by
          core/designsystem theme/ColorSchemes.kt. This is what is on screen while the Wasm module
          downloads and starts, so without it the app opens with a white flash on a dark device.
          It is only a guess made before the settings are read: once the app runs, Main.kt sets the
          page to the chosen theme. Update these two if the default seed changes.
        */
        body { background: #FCF9F3; }
        @media (prefers-color-scheme: dark) { body { background: #15130F; } }
    </style>
</head>
<body>
<script type="application/javascript" src="webApp.js"></script>
</body>
</html>
